name: Apply validated Fedora 45 payload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-validated-payload.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/payload-update/part-*.b64 | base64 -d | gzip -dc > /tmp/payload.patch
          echo 'ef4393d30962981b1b9a1b093b9126f76c57cd12c943e5f8947748ae9e70dc9c  /tmp/payload.patch' | sha256sum -c -

      - name: Checkout validated payload baseline
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: k1.0-final-payload
          fetch-depth: 0
          path: payload

      - name: Apply Review 4 and simplify to main
        working-directory: payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '650786a97209bed438a29d5c4a42c7344ca1842d'
          git apply --check /tmp/payload.patch
          git apply /tmp/payload.patch

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_branch = 'k1.0-final-payload'
          new_branch = 'main'

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if old_branch in text:
                  path.write_text(text.replace(old_branch, new_branch))

          workflow = Path('.github/workflows/build-m1.yml')
          text = workflow.read_text()

          needle = "  pull_request:\n    branches: [main]\n  workflow_dispatch:\n"
          replacement = (
              "  pull_request:\n"
              "    branches: [main]\n"
              "  schedule:\n"
              "    # Fedora 45 Branched: refresh from Minimal :latest once per day.\n"
              "    # After Fedora 45 stable this becomes weekly.\n"
              "    - cron: '17 5 * * *'\n"
              "  workflow_dispatch:\n"
          )
          if needle not in text:
              raise SystemExit('cannot insert daily schedule in build-m1.yml')
          text = text.replace(needle, replacement, 1)

          old_condition = (
              "github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' "
              "&& inputs.publish && inputs.base_image == ''"
          )
          new_condition = (
              "github.ref == 'refs/heads/main' && "
              "(github.event_name == 'push' || github.event_name == 'schedule' || "
              "(github.event_name == 'workflow_dispatch' && inputs.publish && inputs.base_image == ''))"
          )
          count = text.count(old_condition)
          if count < 1:
              raise SystemExit('publish condition not found in build-m1.yml')
          text = text.replace(old_condition, new_condition)
          workflow.write_text(text)
          print(f'Updated {count} publish conditions')
          PY

          cat > docs/BUILD-CADENCE.md <<'EOF'
          # KrisOS45 build cadence

          Until Fedora 45 stable, main rebuilds once per day from
          quay.io/bootc-devel/fedora-bootc-45-minimal:latest.

          Every run resolves latest to the exact digest used for that build.
          If all gates pass, ghcr.io/krism-eu/krisos45:m1 advances to that
          green image. Installed systems never update automatically; the user
          decides when to run the bootc update.

          After Fedora 45 stable, the same refresh becomes weekly.

          krisCC is not an automatic trigger for KrisOS builds during its
          development phase. It is tested manually until its final version is
          deliberately incorporated into KrisOS.
          EOF

      - name: Fast contract gates
        working-directory: payload
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile bin/rk tools/source_snapshot.py
          bash -n systemd/krisos-overlay.sh
          bash -n tests/boot-check.sh
          bash -n tests/release-check.sh
          bash -n tests/run-release-vm.sh
          bash -n scripts/fetch-kriscc-component.sh
          python3 tests/test_rk.py
          python3 tests/test_rk_recovery.py
          python3 tests/test_release_state.py
          python3 tests/test_release_shell.py
          python3 tests/test_overlay_recovery.py
          python3 tests/test_overlay_identity.py
          grep -Fxq 'ARG BASE_IMAGE=quay.io/bootc-devel/fedora-bootc-45-minimal:latest' Containerfile
          grep -Fxq 'KRISCC_TAG=v0.7.10' build_files/krisCC.lock
          grep -Fxq 'KRISCC_RPM=krisCC-0.7.10-1.fc45.x86_64.rpm' build_files/krisCC.lock
          grep -Fxq 'KRISCC_SHA256=bdb3e50ee84d38c487bf188b6a10244761bfeefa26ab17bcdbc4ee3246970cc6' build_files/krisCC.lock
          grep -Fq "cron: '17 5 * * *'" .github/workflows/build-m1.yml
          ! grep -RIn --exclude-dir=.git 'k1.0-final-payload' .
          ! grep -RIn --exclude-dir=.git --exclude='*.rpm' 'fedora-bootc-45-minimal@sha256' .

      - name: Replace main with validated payload
        id: promote_source
        working-directory: payload
        shell: bash
        env:
          STAGING_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Adopt Review 4 Fedora 45 rolling payload'
          new_sha="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/main:${STAGING_MAIN_SHA}" origin HEAD:main
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Start first published rolling build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if gh workflow run build-m1.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish=true; then
              exit 0
            fi
            sleep 3
          done
          echo 'Unable to dispatch Build M1 after publishing main.' >&2
          exit 1
