name: Build K1 Final ISO Candidate

on:
  push:
    branches: [k1.0-final-iso]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k1-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-final-iso:
    name: Pinned main payload + offline Anaconda ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout installer branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Validate installer-only source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n installer/build-installer.sh
          bash -n tests/k1-final-contract.sh
          bash tests/k1-final-contract.sh
          grep -Fq 'FROM quay.io/fedora/fedora-bootc:45' installer/Containerfile
          grep -Fq 'ARG ANACONDA_NEVR=45.25-1.fc45' installer/Containerfile
          grep -Fq 'anaconda-install-env-deps-${ANACONDA_NEVR}' installer/Containerfile
          grep -Fq 'systemctl enable anaconda-shell@.service' installer/Containerfile
          grep -Fq 'label: "Fedora-S-dvd-x86_64-45"' installer/iso.yaml
          grep -Fq 'inst.stage2=hd:LABEL=Fedora-S-dvd-x86_64-45' installer/iso.yaml
          grep -Fq 'bootc-generic-iso' installer/build-installer.sh
          grep -Fq -- '--bootc-default-fs ext4' installer/build-installer.sh
          grep -Fq -- '--bootc-installer-payload-ref "$payload_ref"' installer/build-installer.sh
          grep -Fq -- '--build-arg KRISOS_PAYLOAD_REF="$payload_ref"' installer/build-installer.sh
          grep -Fq 'bootc --source-imgref=registry:$KRISOS_PAYLOAD_REF --target-imgref=$KRISOS_PAYLOAD_REF' installer/Containerfile
          if grep -Eq '^[[:space:]]*(clearpart|autopart|part|partition|logvol|volgroup|user|rootpw|reboot|shutdown)([[:space:]]|$)' installer/Containerfile; then
            echo "ERROR: installer runtime contains unattended/destructive directives" >&2
            exit 1
          fi
          if grep -Eq 'inst\.(ks|cmdline|noninteractive)' installer/iso.yaml; then
            echo "ERROR: ISO kernel arguments enable unattended installation" >&2
            exit 1
          fi
          grep -Fq 'selinux=1 enforcing=0' installer/iso.yaml
          grep -Fq "'selinux --enforcing'" installer/Containerfile

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo xorriso
          sudo podman version

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Verify and pull signed main payload
        id: main_payload
        shell: bash
        run: |
          set -euo pipefail
          source build_files/KrisOS-payload.lock
          [[ "$KRISOS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$KRISOS_TARGET_REF" = "ghcr.io/krism-eu/krisos:$KRISOS_COMMIT" ]]
          [[ "$KRISOS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$KRISOS_KRISCC" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.fc44\.x86_64$ ]]

          authfile="$(mktemp)"
          trap 'rm -f "$authfile"' EXIT
          printf '{"auths":{}}\n' > "$authfile"

          skopeo inspect --raw --authfile "$authfile" "docker://$KRISOS_TARGET_REF" > main-manifest.json
          remote_digest="sha256:$(sha256sum main-manifest.json | awk '{print $1}')"
          test "$remote_digest" = "$KRISOS_DIGEST"
          printf '%s\n' "$remote_digest" > main-payload.digest

          cosign verify \
            --certificate-identity 'https://github.com/krism-eu/KrisOS/.github/workflows/build-m1.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/krism-eu/krisos@$KRISOS_DIGEST" 2>&1 | tee main-cosign-verify.log

          digest_ref="ghcr.io/krism-eu/krisos@$KRISOS_DIGEST"
          sudo podman pull --authfile "$authfile" "$digest_ref"
          sudo podman tag "$digest_ref" "$KRISOS_TARGET_REF"
          test "$(sudo podman image inspect "$KRISOS_TARGET_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$KRISOS_COMMIT"
          image_id="$(sudo podman image inspect "$KRISOS_TARGET_REF" --format '{{.Id}}')"

          sudo podman run --rm -e KRISOS_EXPECT_KRISCC="$KRISOS_KRISCC" --entrypoint /bin/bash "$KRISOS_TARGET_REF" -lc '
            set -euo pipefail
            test "$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" krisCC)" = "$KRISOS_EXPECT_KRISCC"
            rpm -V krisCC
            test -x /usr/bin/krisCC
            test -x /usr/bin/rk
            /usr/bin/rk status --json > /tmp/rk-status.json
            python3 -c '"'"'import json; d=json.load(open("/tmp/rk-status.json")); assert d.get("schema")==1; assert all(k in d for k in ("overlay","pending_recovery","needs_sync","requests")); assert isinstance(d["requests"], list)'"'"'
            grep -Fxq "HOME=/var/home" /etc/default/useradd
            grep -Fxq krisCC /usr/share/krisos/owned-packages.txt
            bootc container lint
            env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic KRISCC_SMOKE_TEST=1 /usr/bin/krisCC --background
          '

          echo "ref=$KRISOS_TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "digest=$KRISOS_DIGEST" >> "$GITHUB_OUTPUT"
          echo "commit=$KRISOS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "kriscc=$KRISOS_KRISCC" >> "$GITHUB_OUTPUT"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Extract exact main QA scripts
        shell: bash
        run: |
          set -euo pipefail
          source build_files/KrisOS-payload.lock
          git fetch --no-tags origin "$KRISOS_COMMIT"
          rm -rf main-qa
          mkdir -p main-qa
          for path in tests/boot-check.sh tests/release-check.sh tests/release-state.py tests/run-release-vm.sh; do
            git show "$KRISOS_COMMIT:$path" > "main-qa/$(basename "$path")"
          done
          chmod 0755 main-qa/boot-check.sh main-qa/release-check.sh main-qa/release-state.py main-qa/run-release-vm.sh
          grep -Fq '/usr/bin/rk status --json' main-qa/release-check.sh

      - name: Validate interactive installer runtime
        shell: bash
        env:
          KRISOS_PAYLOAD_REF: ${{ steps.main_payload.outputs.ref }}
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --build-arg KRISOS_PAYLOAD_REF="$KRISOS_PAYLOAD_REF" \
            -f installer/Containerfile \
            -t localhost/krisos-installer-contract:k1.0 \
            installer
          sudo podman run --rm \
            -e KRISOS_PAYLOAD_REF="$KRISOS_PAYLOAD_REF" \
            --entrypoint /bin/bash localhost/krisos-installer-contract:k1.0 -lc '
            set -euo pipefail
            defaults=/usr/share/anaconda/interactive-defaults.ks
            test -s "$defaults"
            grep -Fxq graphical "$defaults"
            grep -Fxq "lang it_IT.UTF-8" "$defaults"
            grep -Fxq "keyboard --vckeymap=it --xlayouts=it" "$defaults"
            grep -Fxq "timezone Europe/Rome --utc" "$defaults"
            grep -Fxq "selinux --enforcing" "$defaults"
            grep -Fxq "bootc --source-imgref=registry:$KRISOS_PAYLOAD_REF --target-imgref=$KRISOS_PAYLOAD_REF" "$defaults"
            test "$(grep -c "^%post --nochroot --erroronfail$" "$defaults")" -eq 2
            test "$(grep -c "^%end$" "$defaults")" -eq 2
            ! grep -Eq "^[[:space:]]*(clearpart|autopart|part|partition|logvol|volgroup|user|rootpw|reboot|shutdown)([[:space:]]|$)" "$defaults"
            getent passwd install | grep -Fq "/usr/libexec/anaconda/run-anaconda"
            test -x /usr/bin/list-harddrives
            test "$(rpm -q --qf "%{VERSION}-%{RELEASE}" anaconda-core)" = "45.25-1.fc45"
            test "$(rpm -q --qf "%{VERSION}-%{RELEASE}" anaconda-install-img-deps)" = "45.25-1.fc45"
            grep -Fxq "Alias=autovt@.service" /usr/lib/systemd/system/anaconda-shell@.service
            grep -Fxq "DefaultInstance=tty2" /usr/lib/systemd/system/anaconda-shell@.service
            grep -Fxq "ReserveVT=2" /usr/lib/systemd/logind.conf.d/anaconda-logind.conf
            grep -Fxq "StandardInput=null" /usr/lib/systemd/system/anaconda-pre.service
            test "$(readlink -f /etc/systemd/system/autovt@.service)" = "/usr/lib/systemd/system/anaconda-shell@.service"
            test -L /etc/systemd/system/anaconda.target.wants/anaconda-shell@tty2.service
            test "$(readlink -f /etc/systemd/system/default.target)" = "/usr/lib/systemd/system/anaconda.target"
            kernel="$(kernel-install list --json pretty | jq -r ".[] | select(.has_kernel == true) | .version" | head -n1)"
            test -n "$kernel"
            test -s "/usr/lib/modules/$kernel/initramfs.img"
            lsinitrd "/usr/lib/modules/$kernel/initramfs.img" | grep -E "anaconda|anaconda-lib" >/dev/null
          '

      - name: Build offline Anaconda ISO from exact main payload
        shell: bash
        env:
          KRISOS_PAYLOAD_REF: ${{ steps.main_payload.outputs.ref }}
          KRISOS_PAYLOAD_IMAGE_ID: ${{ steps.main_payload.outputs.image_id }}
        run: |
          set -euo pipefail
          bash installer/build-installer.sh 2>&1 | tee installer-build.log

      - name: Verify and seal ISO bundle
        shell: bash
        env:
          MAIN_REF: ${{ steps.main_payload.outputs.ref }}
          MAIN_DIGEST: ${{ steps.main_payload.outputs.digest }}
          MAIN_COMMIT: ${{ steps.main_payload.outputs.commit }}
          MAIN_KRISCC: ${{ steps.main_payload.outputs.kriscc }}
        run: |
          set -euo pipefail
          iso="$(find installer/output -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          test -s "$iso"
          (cd installer/output && sha256sum --check SHA256SUMS)

          xorriso -indev "$iso" -pvd_info 2>&1 | tee iso-pvd.txt
          grep -Fq "Volume id    : 'Fedora-S-dvd-x86_64-45'" iso-pvd.txt
          xorriso -indev "$iso" -report_el_torito plain 2>&1 | tee iso-eltorito.txt
          grep -Eq 'El Torito boot img :.*BIOS.* y ' iso-eltorito.txt
          grep -Eq 'El Torito boot img :.*UEFI.* y ' iso-eltorito.txt

          manifest="$(find installer/output -type f -name '*.osbuild-manifest.json' -print -quit)"
          test -n "$manifest"
          python3 - "$manifest" "$MAIN_REF" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          payload_ref = sys.argv[2]
          methods = []
          def walk(value):
              if isinstance(value, dict):
                  if value.get("type") == "org.osbuild.squashfs":
                      methods.append(((value.get("options") or {}).get("compression") or {}).get("method"))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(manifest)
          if "zstd" not in methods:
              raise SystemExit(f"installer SquashFS is not zstd-compressed: {methods!r}")
          if payload_ref not in json.dumps(manifest, sort_keys=True):
              raise SystemExit("validated payload reference is missing from installer manifest")
          PY

          install -d -m 0755 installer/output/qa
          cp build_files/KrisOS-payload.lock installer/output/KrisOS-main-payload.lock
          cp docs/K1_STABLE_BACKUP.md installer/output/
          cp main-qa/* installer/output/qa/

          cat > installer/output/BUILD_IDENTITY.txt <<EOF
          main_ref=$MAIN_REF
          main_digest=$MAIN_DIGEST
          main_commit=$MAIN_COMMIT
          kriscc=$MAIN_KRISCC
          EOF

          (
            cd installer/output
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          sha256sum "$iso" | tee final-iso.sha256

      - name: Preserve ISO diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krisos-k1-diagnostics-${{ github.sha }}
          path: |
            installer/output/**
            main-payload.digest
            main-manifest.json
            main-cosign-verify.log
            installer-build.log
            iso-pvd.txt
            iso-eltorito.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload final main-aligned ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krisos-k1-main-aligned-${{ github.sha }}
          path: |
            installer/output/**
            main-payload.digest
            main-manifest.json
            main-cosign-verify.log
            installer-build.log
            iso-pvd.txt
            iso-eltorito.txt
            final-iso.sha256
            tests/k1-final-contract.sh
            installer/README.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
