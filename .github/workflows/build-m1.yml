name: Build M1 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_image:
        description: "Optional exact/tagged Fedora bootc base; resolved to digest by the shared gate"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Read-only candidate validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo rpm
          podman version
          skopeo --version

      - name: Run the shared local/CI hardening gate
        env:
          GH_TOKEN: ${{ github.token }}
          KRISOS_BASE_IMAGE: ${{ inputs.base_image }}
          KRISOS_LOCAL_TAG: localhost/krisos45:pr-validation
          KRISOS_SOURCE_REVISION: ${{ github.sha }}
        run: ./tests/local-hardening-check.sh

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validate-m1-${{ github.sha }}-${{ github.run_id }}
          path: |
            fedora45-base.txt
            build.log
            rk-integration.log
          if-no-files-found: ignore
