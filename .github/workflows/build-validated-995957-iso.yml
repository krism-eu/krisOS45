name: Build validated 995957 ISO

on:
  push:
    branches: [iso-rebuild-995957]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-rebuild-995957-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Exact M1 payload to offline Anaconda ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout ISO branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Validate installer-only contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n installer/build-installer.sh
          bash -n tests/k1-final-contract.sh
          bash tests/k1-final-contract.sh

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo xorriso
          podman version
          skopeo --version

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Verify exact signed KrisOS payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          source build_files/KrisOS-payload.lock
          [[ "$KRISOS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$KRISOS_SOURCE_REF" =~ ^ghcr\.io/krism-eu/krisos45:build-[0-9]+-[0-9]+$ ]]
          [[ "$KRISOS_TARGET_REF" = 'ghcr.io/krism-eu/krisos45:m1' ]]
          [[ "$KRISOS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$KRISOS_KRISCC" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.fc45\.x86_64$ ]]

          authfile="$(mktemp)"
          trap 'rm -f "$authfile"' EXIT
          printf '{"auths":{}}\n' > "$authfile"

          skopeo inspect --raw --authfile "$authfile" "docker://$KRISOS_SOURCE_REF" > payload-manifest.json
          source_digest="sha256:$(sha256sum payload-manifest.json | awk '{print $1}')"
          test "$source_digest" = "$KRISOS_DIGEST"

          target_digest="$(skopeo inspect --authfile "$authfile" --format '{{.Digest}}' "docker://$KRISOS_TARGET_REF")"
          test "$target_digest" = "$KRISOS_DIGEST"

          cosign verify \
            --certificate-identity 'https://github.com/krism-eu/krisOS45/.github/workflows/publish-candidate.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/krism-eu/krisos45@$KRISOS_DIGEST" 2>&1 | tee payload-cosign-verify.log

          digest_ref="ghcr.io/krism-eu/krisos45@$KRISOS_DIGEST"
          sudo podman pull --authfile "$authfile" "$digest_ref"
          sudo podman tag "$digest_ref" "$KRISOS_SOURCE_REF"
          test "$(sudo podman image inspect "$KRISOS_SOURCE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$KRISOS_COMMIT"
          image_id="$(sudo podman image inspect "$KRISOS_SOURCE_REF" --format '{{.Id}}')"

          sudo podman run --rm \
            -e KRISOS_EXPECT_KRISCC="$KRISOS_KRISCC" \
            --entrypoint /bin/bash "$KRISOS_SOURCE_REF" -lc '
              set -euo pipefail
              test "$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" krisCC)" = "$KRISOS_EXPECT_KRISCC"
              rpm -V krisCC
              test -x /usr/bin/krisCC
              test -x /usr/libexec/kriscc/archive
              test -x /usr/libexec/kriscc/cleanup-estimate
              test -x /usr/bin/rk
              test -x /usr/libexec/krisos/repair-home-labels
              test -f /usr/lib/systemd/system/krisos-bluetooth-firstboot.service
              grep -Fxq "HOME=/var/home" /etc/default/useradd
              ! firewall-offline-cmd --zone=public --list-services | tr " " "\n" | grep -Eq "^(ssh|mdns)$"
              bootc container lint
              env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic KRISCC_SMOKE_TEST=1 /usr/bin/krisCC --background
            '

          echo "source_ref=$KRISOS_SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "target_ref=$KRISOS_TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "digest=$KRISOS_DIGEST" >> "$GITHUB_OUTPUT"
          echo "commit=$KRISOS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "kriscc=$KRISOS_KRISCC" >> "$GITHUB_OUTPUT"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Build offline Anaconda ISO
        shell: bash
        env:
          KRISOS_SOURCE_REF: ${{ steps.payload.outputs.source_ref }}
          KRISOS_TARGET_REF: ${{ steps.payload.outputs.target_ref }}
          KRISOS_PAYLOAD_IMAGE_ID: ${{ steps.payload.outputs.image_id }}
        run: |
          set -euo pipefail
          bash installer/build-installer.sh 2>&1 | tee installer-build.log

      - name: Verify and seal ISO
        shell: bash
        env:
          SOURCE_REF: ${{ steps.payload.outputs.source_ref }}
          TARGET_REF: ${{ steps.payload.outputs.target_ref }}
          PAYLOAD_DIGEST: ${{ steps.payload.outputs.digest }}
          PAYLOAD_COMMIT: ${{ steps.payload.outputs.commit }}
          KRISCC_NEVRA: ${{ steps.payload.outputs.kriscc }}
        run: |
          set -euo pipefail
          iso="$(find installer/output -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          test -s "$iso"
          (cd installer/output && sha256sum --check SHA256SUMS)

          xorriso -indev "$iso" -pvd_info 2>&1 | tee iso-pvd.txt
          grep -Fq "Volume id    : 'Fedora-S-dvd-x86_64-45'" iso-pvd.txt
          xorriso -indev "$iso" -report_el_torito plain 2>&1 | tee iso-eltorito.txt
          grep -Eq 'El Torito boot img :.*BIOS.* y ' iso-eltorito.txt
          grep -Eq 'El Torito boot img :.*UEFI.* y ' iso-eltorito.txt

          manifest="$(find installer/output -type f -name '*.osbuild-manifest.json' -print -quit)"
          test -n "$manifest"
          python3 - "$manifest" "$SOURCE_REF" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              manifest = json.load(stream)
          source_ref = sys.argv[2]
          encoded = json.dumps(manifest, sort_keys=True)
          if source_ref not in encoded:
              raise SystemExit('exact immutable payload ref missing from osbuild manifest')
          methods = []
          def walk(value):
              if isinstance(value, dict):
                  if value.get('type') == 'org.osbuild.squashfs':
                      methods.append(((value.get('options') or {}).get('compression') or {}).get('method'))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(manifest)
          if 'zstd' not in methods:
              raise SystemExit(f'installer SquashFS is not zstd-compressed: {methods!r}')
          PY

          cp build_files/KrisOS-payload.lock installer/output/KrisOS-main-payload.lock
          cat > installer/output/BUILD_IDENTITY.txt <<EOF
          source_ref=$SOURCE_REF
          target_ref=$TARGET_REF
          payload_digest=$PAYLOAD_DIGEST
          payload_commit=$PAYLOAD_COMMIT
          kriscc=$KRISCC_NEVRA
          EOF

          (
            cd installer/output
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          sha256sum "$iso" | tee final-iso.sha256

      - name: Upload ISO candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krisos-iso-995957-${{ github.sha }}
          path: |
            installer/output/**
            payload-manifest.json
            payload-cosign-verify.log
            installer-build.log
            iso-pvd.txt
            iso-eltorito.txt
            final-iso.sha256
            tests/k1-final-contract.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
