name: Promote M1

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Signed immutable candidate digest (sha256:...)"
        required: true
        type: string
      rk_package:
        description: "Signed Fedora package fixture absent from the base image"
        required: true
        default: tree
        type: string

permissions:
  contents: read

concurrency:
  group: promote-m1
  cancel-in-progress: false

jobs:
  promote:
    name: Verify signature, pass real VM gate, then advance m1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: stable-promotion
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main

      - name: Validate immutable digest input
        env:
          CANDIDATE_DIGEST: ${{ inputs.digest }}
          RK_PACKAGE: ${{ inputs.rk_package }}
        run: |
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RK_PACKAGE" =~ ^[A-Za-z0-9][A-Za-z0-9+_.-]{0,127}$ ]]

      - name: Install promotion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo openssh-client

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Verify candidate signature and workflow identity
        env:
          CANDIDATE_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/krism-eu/krisos45@${CANDIDATE_DIGEST}"
          cosign verify \
            --certificate-identity 'https://github.com/krism-eu/krisOS45/.github/workflows/publish-candidate.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image" 2>&1 | tee cosign-promote-verify.log

      - name: Configure SSH for disposable release VM
        env:
          E2E_SSH_KEY: ${{ secrets.KRISOS_E2E_SSH_KEY }}
          E2E_KNOWN_HOSTS: ${{ secrets.KRISOS_E2E_KNOWN_HOSTS }}
          E2E_TARGET: ${{ secrets.KRISOS_E2E_TARGET }}
        run: |
          set -euo pipefail
          test -n "$E2E_SSH_KEY"
          test -n "$E2E_KNOWN_HOSTS"
          test -n "$E2E_TARGET"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$E2E_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$E2E_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Run mandatory real VM transaction and switch gate
        env:
          CANDIDATE_DIGEST: ${{ inputs.digest }}
          KRISOS_E2E_TARGET: ${{ secrets.KRISOS_E2E_TARGET }}
          KRISOS_EXPECT_ADMIN_USER: ${{ secrets.KRISOS_EXPECT_ADMIN_USER }}
          KRISOS_E2E_RK_PACKAGE: ${{ inputs.rk_package }}
        run: |
          set -euo pipefail
          source build_files/krisCC.lock
          expected_kriscc="${KRISCC_RPM#krisCC-}"
          expected_kriscc="${expected_kriscc%.rpm}"
          image="ghcr.io/krism-eu/krisos45@${CANDIDATE_DIGEST}"
          KRISOS_EXPECT_KRISCC="$expected_kriscc" \
          KRISOS_EXPECT_IMAGE="$image" \
          KRISOS_E2E_SWITCH_IMAGE="$image" \
          tests/run-release-vm.sh 2>&1 | tee vm-gate.log

      - name: Login to GHCR only after VM gate
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$HOME/.docker/config.json" \
            ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Advance m1 to the exact gated digest
        env:
          CANDIDATE_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          source="docker://ghcr.io/krism-eu/krisos45@${CANDIDATE_DIGEST}"
          target="docker://ghcr.io/krism-eu/krisos45:m1"
          skopeo copy --all --authfile "$HOME/.docker/config.json" "$source" "$target"
          promoted="$(skopeo inspect --authfile "$HOME/.docker/config.json" --format '{{.Digest}}' "$target")"
          test "$promoted" = "$CANDIDATE_DIGEST"
          printf '%s\n' "$promoted" > promoted-m1.digest
          printf 'Promoted m1 digest: %s\n' "$promoted" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promote-m1-${{ github.run_id }}
          path: |
            cosign-promote-verify.log
            vm-gate.log
            promoted-m1.digest
          if-no-files-found: ignore
