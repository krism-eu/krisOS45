name: Promote M1

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Signed immutable candidate digest (sha256:...)"
        required: true
        type: string
      allow_rollback:
        description: "Allow promotion when candidate revision is not a descendant of current m1"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: promote-m1
  cancel-in-progress: false

jobs:
  promote:
    name: Verify signed digest and advance m1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: stable-promotion
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Validate immutable digest input
        env:
          CANDIDATE_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Install promotion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Verify candidate signature and workflow identity
        env:
          CANDIDATE_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/krism-eu/krisos45@${CANDIDATE_DIGEST}"
          cosign verify \
            --certificate-identity 'https://github.com/krism-eu/krisOS45/.github/workflows/publish-candidate.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image" 2>&1 | tee cosign-promote-verify.log

      - name: Login to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$HOME/.docker/config.json" \
            ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Enforce promotion ancestry
        env:
          CANDIDATE_DIGEST: ${{ inputs.digest }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        run: |
          set -euo pipefail
          authfile="$HOME/.docker/config.json"
          candidate="docker://ghcr.io/krism-eu/krisos45@${CANDIDATE_DIGEST}"
          current="docker://ghcr.io/krism-eu/krisos45:m1"

          candidate_rev="$(skopeo inspect --authfile "$authfile" \
            --format '{{ index .Labels "org.opencontainers.image.revision" }}' "$candidate")"
          [[ "$candidate_rev" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Candidate image has invalid org.opencontainers.image.revision: $candidate_rev" >&2
            exit 1
          }
          if ! git cat-file -e "${candidate_rev}^{commit}" 2>/dev/null; then
            echo "Candidate revision ${candidate_rev} is not present in local git history; refusing promotion." >&2
            exit 1
          fi

          current_json="${RUNNER_TEMP:-/tmp}/current-m1.json"
          current_err="${RUNNER_TEMP:-/tmp}/current-m1.err"
          if skopeo inspect --authfile "$authfile" "$current" >"$current_json" 2>"$current_err"; then
            current_rev="$(skopeo inspect --authfile "$authfile" \
              --format '{{ index .Labels "org.opencontainers.image.revision" }}' "$current")"
            [[ "$current_rev" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Current m1 has invalid org.opencontainers.image.revision: $current_rev" >&2
              exit 1
            }
            if ! git cat-file -e "${current_rev}^{commit}" 2>/dev/null; then
              echo "Current m1 revision ${current_rev} is not present in local git history; refusing promotion." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$current_rev" "$candidate_rev"; then
              if [[ "$ALLOW_ROLLBACK" != "true" ]]; then
                echo "Refusing rollback/non-descendant promotion: current=$current_rev candidate=$candidate_rev" >&2
                exit 1
              fi
              echo "Explicit rollback override accepted: current=$current_rev candidate=$candidate_rev"
            fi
            printf 'current_revision=%s\ncandidate_revision=%s\nallow_rollback=%s\n' \
              "$current_rev" "$candidate_rev" "$ALLOW_ROLLBACK" > promotion-lineage.txt
          else
            if grep -Eqi 'manifest unknown|name unknown|not found' "$current_err"; then
              echo "No existing m1 tag; ancestry check skipped."
              printf 'current_revision=none\ncandidate_revision=%s\nallow_rollback=%s\n' \
                "$candidate_rev" "$ALLOW_ROLLBACK" > promotion-lineage.txt
            else
              cat "$current_err" >&2
              exit 1
            fi
          fi

      - name: Advance m1 to the exact verified digest
        env:
          CANDIDATE_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          source="docker://ghcr.io/krism-eu/krisos45@${CANDIDATE_DIGEST}"
          target="docker://ghcr.io/krism-eu/krisos45:m1"
          skopeo copy --all --authfile "$HOME/.docker/config.json" "$source" "$target"
          promoted="$(skopeo inspect --authfile "$HOME/.docker/config.json" --format '{{.Digest}}' "$target")"
          test "$promoted" = "$CANDIDATE_DIGEST"
          printf '%s\n' "$promoted" > promoted-m1.digest
          printf 'Promoted m1 digest: %s\n' "$promoted" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promote-m1-${{ github.run_id }}
          path: |
            cosign-promote-verify.log
            promotion-lineage.txt
            promoted-m1.digest
          if-no-files-found: ignore
