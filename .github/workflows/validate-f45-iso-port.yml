name: Validate Fedora 45 ISO port source

on:
  push:
    branches: [port/f45-iso]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Validate installer source without payload lock
        shell: bash
        run: |
          set -euo pipefail
          bash -n installer/build-installer.sh
          bash -n installer/krisos-fstab-finalize.ks
          bash -n installer/krisos-home-labels-finalize.ks
          bash -n tests/k1-final-contract.sh
          bash tests/k1-final-contract.sh
          grep -Fxq 'FROM quay.io/fedora/fedora-bootc:45' installer/Containerfile
          grep -Fxq 'ARG ANACONDA_NEVR=45.25-1.fc45' installer/Containerfile
          grep -Fq 'bootc-generic-iso' installer/build-installer.sh
          grep -Fq 'ghcr.io/krism-eu/krisos45:' .github/workflows/build-k1-final-iso.yml
          grep -Fq 'krism-eu/krisOS45/.github/workflows/build-m1.yml@refs/heads/k1.0-final-payload' .github/workflows/build-k1-final-iso.yml
          ! grep -Fq 'ghcr.io/krism-eu/krisos:' .github/workflows/build-k1-final-iso.yml
          ! grep -Fq 'github.com/krism-eu/KrisOS/.github/workflows/build-m1.yml' .github/workflows/build-k1-final-iso.yml
          if grep -Eq 'inst\.(ks|cmdline|noninteractive)' installer/iso.yaml; then
            echo "unattended installer boot arguments are forbidden" >&2
            exit 1
          fi
          grep -Fq 'selinux=1 enforcing=0' installer/iso.yaml
          grep -Fq "'selinux --enforcing'" installer/Containerfile
