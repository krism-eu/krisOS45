name: Validate Fedora 45 ISO port source

on:
  push:
    branches: [port/f45-iso]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Validate exact ISO source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n installer/build-installer.sh
          bash -n tests/k1-final-contract.sh
          bash tests/k1-final-contract.sh
          grep -Fxq 'FROM quay.io/fedora/fedora-bootc:45' installer/Containerfile
          grep -Fxq 'ARG ANACONDA_NEVR=45.27-1.fc45' installer/Containerfile
          grep -Fq 'ghcr.io/krism-eu/krisos45:' .github/workflows/build-k1-final-iso.yml
          grep -Fq 'krism-eu/krisOS45/.github/workflows/build-m1.yml@refs/heads/k1.0-final-payload' .github/workflows/build-k1-final-iso.yml
          ! grep -R -F '45.25-1.fc45' . --exclude-dir=.git --exclude=validate-f45-iso-port.yml
