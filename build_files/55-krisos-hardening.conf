# KrisOS conservative hardening carried forward from physical Fedora 44 acceptance.
# Fedora 45 VM checks verify the effective values, but physical F45 revalidation of
# Plasma/Wayland, PipeWire, NetworkManager, rootless Podman and suspend/resume is
# still required before stable promotion. Keep this intentionally small.
kernel.kptr_restrict = 2
fs.protected_regular = 2
fs.protected_fifos = 2
fs.suid_dumpable = 0
