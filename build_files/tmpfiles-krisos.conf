# KrisOS persistent state provisioning.
# Seed package intent and first-boot NetworkManager radio policy only when the
# destination is missing; never overwrite persistent user choices on reboot or
# image update.
d /var/lib/krisos 0755 root root -
f /var/lib/krisos/lock 0644 root root -
C /var/lib/krisos/packages.list 0644 root root - /usr/share/factory/var/lib/krisos/packages.list
d /var/lib/NetworkManager 0700 root root -
C /var/lib/NetworkManager/NetworkManager.state 0600 root root - /usr/share/factory/var/lib/NetworkManager/NetworkManager.state
